<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="WLW TV Archive 电视剧详情页">
    <title>电视剧详情 · WLW TV Archive</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./tv.css">
  </head>
  <body class="detail-body">
    <header class="detail-header">
      <a class="detail-back" href="./index.html" aria-label="返回上一页">←</a>
      <a class="detail-brand" href="./index.html">WLW TV ARCHIVE</a>
    </header>

    <main class="detail-main" id="detail-main" aria-live="polite">
      <p class="detail-loading" id="detail-loading">正在读取电视剧资料…</p>

      <article class="detail-article" id="detail-article" hidden>
        <section class="detail-hero" aria-labelledby="detail-title">
          <img class="detail-poster" id="detail-poster" src="" alt="">
          <div class="detail-heading">
            <h1 id="detail-title"></h1>
            <p class="detail-years" id="detail-years"></p>
          </div>
        </section>

        <div class="poster-divider" aria-hidden="true"></div>

        <section class="summary-information" aria-label="电视剧简介">
          <p class="detail-meta" id="detail-meta"></p>
          <div class="synopsis" id="synopsis"></div>
        </section>

        <section class="resource-information" id="resource-information" aria-labelledby="resource-title">
          <h2 id="resource-title">资源</h2>
          <div class="resource-list" id="resource-list"></div>
        </section>

        <section class="detail-tabs-section" aria-label="电视剧完整资料">
          <div class="detail-tabs" role="tablist" aria-label="电视剧资料分类">
            <button class="detail-tab active" id="tab-seasons" role="tab" aria-selected="true" aria-controls="panel-seasons" data-panel="seasons">Seasons</button>
            <button class="detail-tab" id="tab-details" role="tab" aria-selected="false" aria-controls="panel-details" data-panel="details">Details</button>
            <button class="detail-tab" id="tab-cast" role="tab" aria-selected="false" aria-controls="panel-cast" data-panel="cast">Cast</button>
            <button class="detail-tab" id="tab-crew" role="tab" aria-selected="false" aria-controls="panel-crew" data-panel="crew">Crew</button>
          </div>

          <div class="tab-panel active" id="panel-seasons" role="tabpanel" aria-labelledby="tab-seasons"><div class="season-list" id="season-list"></div></div>
          <div class="tab-panel" id="panel-details" role="tabpanel" aria-labelledby="tab-details" hidden><dl class="series-details" id="series-details"></dl></div>
          <div class="tab-panel" id="panel-cast" role="tabpanel" aria-labelledby="tab-cast" hidden><div class="people-grid" id="cast-list"></div></div>
          <div class="tab-panel" id="panel-crew" role="tabpanel" aria-labelledby="tab-crew" hidden><div class="people-grid" id="crew-list"></div></div>
        </section>
      </article>

      <section class="detail-error" id="detail-error" hidden>
        <h1>暂时无法显示详情</h1>
        <p id="detail-error-message"></p>
        <a class="outline-button" href="./index.html">返回电视剧列表</a>
      </section>
    </main>

    <script src="./catalog-data.js"></script>
    <script src="./others-data.js"></script>
    <script src="./movie-metadata.js"></script>
    <script src="./tmdb-details.generated.js"></script>
    <script src="./movie-data-utils.js"></script>
    <script src="./synopsis-translations.js"></script>
    <script src="./cast-overrides.js"></script>
    <script src="./movie-resources.js"></script>
    <script src="./tv.js"></script>
  </body>
</html>
