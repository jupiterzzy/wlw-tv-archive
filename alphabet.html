<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="按首字母浏览 WLW TV Archive。"
    />
    <title>按首字母 · WLW TV Archive</title>
    <link rel="icon" type="image/svg+xml" href="./assets/tv-icon.svg">
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <header class="hero" id="hero">
      <div class="hero-shade"></div>

      <div class="hero-content">
        <p class="eyebrow">WLW TV ARCHIVE</p>
        <h1 class="sr-only">按首字母浏览 WLW 电视剧</h1>

        <form class="search" id="search-form" role="search" autocomplete="off">
          <label class="sr-only" for="tv-search">搜索电视剧</label>
          <span class="search-icon" aria-hidden="true"></span>

          <input
            id="tv-search"
            type="search"
            placeholder="搜索电视剧名或译名（支持中英文搜索）"
            aria-controls="search-results"
            aria-expanded="false"
          />

          <button type="submit">搜索</button>

          <div
            class="search-results"
            id="search-results"
            role="listbox"
            hidden
          ></div>
        </form>
      </div>

      <div class="slide-status" aria-label="背景图片轮播">
        <span id="slide-count">01 / 05</span>
        <div class="slide-line">
          <span id="slide-progress"></span>
        </div>
      </div>
    </header>

    <main>
      <nav class="view-switcher" aria-label="其他浏览方式">
        <a class="outline-button" href="./index.html">Home</a>
        <a class="outline-button" href="./networks.html">Networks</a>
        <a class="outline-button" href="./year.html">Years</a>
        <a class="outline-button" href="./countries.html">Countries</a>
        <a class="outline-button" href="./others.html">Others</a>
      </nav>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <h2 id="catalog-title">A</h2>
        </div>

        <div class="movie-grid" id="movie-grid"></div>
      </section>

      <nav class="alphabet-pagination" aria-label="按首字母浏览">
        <div class="alphabet-track" id="alphabet-track"></div>
      </nav>
    </main>

    <template id="movie-card-template">
      <article class="movie-card">
        <a class="poster-link" href="#">
          <img class="poster" src="" alt="" />
          <span class="poster-placeholder" aria-hidden="true">IMAGE</span>
        </a>

        <div class="movie-copy">
          <h3><a href="#"></a></h3>
          <p class="movie-meta"></p>
        </div>
      </article>
    </template>

    <script src="./catalog-data.js"></script>
    <script src="./movie-metadata.js"></script>
    <script src="./tmdb-details.generated.js"></script>
    <script src="./movie-data-utils.js"></script>
    <script src="./alphabet.js"></script>
    <script src="./history-nav.js"></script>
  </body>
</html>
