<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="按年份浏览 WLW 电视剧。"><title>年份 · WLW TV Archive</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./listing.css"></head>
<body class="listing-page"><header class="listing-header"><a href="./index.html">WLW TV ARCHIVE</a><nav><a href="./index.html">首页</a></nav></header>
<main class="listing-main"><div class="listing-title-row year-title-row"><h1>Years</h1></div><nav class="year-controls" aria-label="年份顺序">
  <a id="ascending" class="sort-button" href="./year.html?sort=asc">从早到晚</a>

  <a id="descending" class="sort-button" href="./year.html?sort=desc">从晚到早</a>

  <form class="year-range-form" id="year-range-form">
    <span class="year-range-label">从</span>

    <input
      id="year-from"
      class="year-range-input"
      type="number"
      inputmode="numeric"
      min="1800"
      max="2100"
      placeholder="1988"
      aria-label="起始年份"
    >

    <span class="year-range-label">到</span>

    <input
      id="year-to"
      class="year-range-input"
      type="number"
      inputmode="numeric"
      min="1800"
      max="2100"
      placeholder="1998"
      aria-label="结束年份"
    >

    <button class="year-range-submit" type="submit">确定</button>
  </form>
</nav><div class="listing-grid" id="listing-grid"></div><nav class="listing-pagination" id="listing-pagination" aria-label="页面"></nav></main>
<template id="listing-card-template"><article class="movie-card"><a class="poster-link" href="#" aria-label="电视剧详情暂未制作"><span class="poster-placeholder" aria-hidden="true">IMAGE</span></a><div class="movie-copy"><h3><a href="#"></a></h3><p class="movie-meta"></p></div></article></template>
<script src="./catalog-data.js"></script><script src="./movie-metadata.js"></script><script src="./tmdb-details.generated.js"></script><script src="./movie-data-utils.js"></script><script src="./year.js"></script><script src="./history-nav.js"></script></body></html>
